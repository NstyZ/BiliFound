<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>直播</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #dm { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .dm-item {
      position: absolute; left: 100%;
      white-space: nowrap;
      font: 700 clamp(15px, 2.1vw, 26px) -apple-system, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      text-shadow: 0 1px 4px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9);
      animation: dm-move linear forwards;
      will-change: transform;
    }
    @keyframes dm-move {
      from { transform: translateX(0); }
      to { transform: translateX(calc(-100vw - 100%)); }
    }
    #fs-exit {
      position: absolute; top: 16px; right: 18px;
      display: none;
      height: 34px; padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.3);
      background: rgba(16,18,26,.62);
      color: #fff; font: 12px -apple-system, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      cursor: pointer; backdrop-filter: blur(12px);
    }
    body.fs #fs-exit { display: block; }
    #tip {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      color: rgba(255,255,255,.75); font: 13px -apple-system, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      text-align: center; padding: 20px;
    }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline></video>
  <div id="dm"></div>
  <button id="fs-exit" title="退出全屏（Esc）">退出全屏</button>
  <div id="tip"></div>
  <script src="../node_modules/hls.js/dist/hls.min.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const v = document.getElementById('v');
      const tip = document.getElementById('tip');
      const fail = (msg) => { tip.style.display = 'flex'; tip.textContent = msg || '直播流加载失败'; };
      let hls = null;
      let src = params.get('url') || '';

      function play(url) {
        if (!url) { fail('缺少直播地址'); return; }
        tip.style.display = 'none';
        src = url;
        try { if (hls) { hls.destroy(); hls = null; } } catch (e) {}
        v.removeAttribute('src');
        if (url.includes('.m3u8') || url.includes('http_hls')) {
          if (window.Hls && Hls.isSupported()) {
            hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 3 });
            hls.loadSource(url);
            hls.attachMedia(v);
            hls.on(Hls.Events.ERROR, (_e, data) => {
              if (data && data.fatal) fail('直播流错误：' + data.details);
            });
            v.play().catch(() => {});
          } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
            v.src = url;
            v.play().catch(() => {});
          } else {
            fail('当前环境不支持 HLS');
          }
        } else {
          v.src = url;
          v.play().catch(() => {});
        }
      }

      window.__setSrc = (url) => play(url);
      window.__setVolume = (vol) => { v.volume = Math.max(0, Math.min(1, Number(vol))); };
      window.__setMuted = (on) => { v.muted = !!on; };
      window.__state = () => ({ volume: v.volume, muted: v.muted, paused: v.paused, src });

      // 画面弹幕
      const dmLayer = document.getElementById('dm');
      const lanes = new Array(9).fill(0);
      window.__dm = (d) => {
        if (!d || !d.text) return;
        const now = Date.now();
        let lane = 0;
        for (let i = 0; i < lanes.length; i += 1) {
          if (lanes[i] <= now) { lane = i; break; }
          if (lanes[i] < lanes[lane]) lane = i;
        }
        lanes[lane] = now + 1400;
        const el = document.createElement('div');
        el.className = 'dm-item';
        el.textContent = d.text;
        el.style.top = `${4 + lane * 10}%`;
        if (d.color) el.style.color = '#' + Number(d.color).toString(16).padStart(6, '0');
        const dur = 8000 + Math.random() * 2000;
        el.style.animationDuration = `${dur}ms`;
        dmLayer.appendChild(el);
        setTimeout(() => el.remove(), dur + 200);
      };

      // 全屏状态
      window.__setFs = (on) => {
        document.body.classList.toggle('fs', !!on);
      };
      document.getElementById('fs-exit').addEventListener('click', () => {
        if (window.liveBridge) window.liveBridge.exitFs();
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && window.liveBridge) window.liveBridge.exitFs();
      });

      v.addEventListener('error', () => fail('直播流加载失败'));
      play(src);
    })();
  </script>
</body>
</html>
